spring:
  application:
    name: notifications-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: notifications-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: orderCreatedEvent:com.portfolio.notifications.event.OrderCreatedEvent
    properties:
      security.protocol: SSL
      ssl.truststore.location: /app/client.truststore.jks
      ssl.truststore.password: ${SSL_STORE_PASSWORD}
      ssl.keystore.location: /app/client.keystore.jks
      ssl.keystore.password: ${SSL_STORE_PASSWORD}
      ssl.key.password: ${SSL_STORE_PASSWORD}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.portfolio.notifications: INFO
    org.springframework.kafka: WARN
